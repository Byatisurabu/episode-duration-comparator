<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 { color: #0066cc; }
        form { margin-top: 30px; }
        input[type="url"] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background: #0066cc;
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #0055aa; }
    </style>
</head>
<body>
    <h1>📊 Сравнитель длительности серий</h1>
    {% if error_messages %}
        <div style="background:#ffebee; padding:16px; border-radius:8px; margin:16px 0; border-left:4px solid #c62828;">
            <strong>Обнаружены ошибки:</strong>
            <ul>
                {% for err in error_messages %}
                    <li>{{ err }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}
    

    <p><strong>MVP v0.1</strong> — сравниваем baseline и compared</p>

    <!-- Форма-заглушка (будет использоваться на Этапе 1.2) -->
    <form action="/compare" method="post">
        <label for="baseline">Baseline URL (оригинал):</label><br>
        <input type="url" id="baseline" name="baseline_url" placeholder="https://www.imdb.com/title/tt..." required><br><br>

        <label for="compared">Compared URL (для сравнения):</label><br>
        <input type="url" id="compared" name="compared_url" placeholder="https://www.amediateka.ru/..." required><br><br>

        <button type="submit">🚀 Сравнить длительности</button>
    </form>

    <hr>
    <small>Этап 1.1 — сервер запущен успешно ✅</small>
</body>
</html>
