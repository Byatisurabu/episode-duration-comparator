services:
  app:
    build: .
    container_name: episode-comparator
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1

  bot:
    build: .
    container_name: episode-comparator-bot
    command: ["python", "-m", "bot.main"]
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - BOT_TOKEN=${BOT_TOKEN}
    depends_on:
      - app